name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shotgun_test
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: shotgun_ninjas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U shotgun_test -d shotgun_ninjas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shotgun_test:disposable-only@127.0.0.1:5432/shotgun_ninjas_test
      TEST_DATABASE_URL: postgres://shotgun_test:disposable-only@127.0.0.1:5432/shotgun_ninjas_test
      BASE_PATH: /
      PORT: 5173
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize disposable schema
        run: pnpm --filter @workspace/db push
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit:links
      - run: pnpm --filter @workspace/api-server test
      - name: Verify serving build identity and unavailable-database behavior
        run: node scripts/check-api-build.mjs
